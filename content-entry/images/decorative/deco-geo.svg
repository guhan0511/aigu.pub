<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotsNavy" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.4" fill="#14163A"/>
    </pattern>
    <pattern id="dotsCream" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2" fill="#F8F1EA"/>
    </pattern>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C14F74"/>
      <stop offset="100%" stop-color="#1C7A8C"/>
    </linearGradient>
  </defs>

  <!-- pink top band -->
  <rect x="0" y="0" width="320" height="108" fill="#C14F74"/>
  <rect x="0" y="0" width="150" height="108" fill="url(#dotsCream)" opacity=".55"/>

  <!-- navy right block -->
  <rect x="196" y="0" width="124" height="216" fill="#14163A"/>

  <!-- cream dotted block -->
  <rect x="0" y="108" width="196" height="96" fill="#F3E4DD"/>
  <rect x="0" y="108" width="196" height="96" fill="url(#dotsNavy)" opacity=".5"/>

  <!-- gold circle, bottom-left -->
  <circle cx="58" cy="300" r="98" fill="#A8822E"/>

  <!-- gradient arch -->
  <path d="M132,320 a88,88 0 0 1 176,0 Z" fill="url(#arcGrad)"/>

  <!-- navy ring badge -->
  <circle cx="246" cy="156" r="48" fill="#14163A"/>
  <circle cx="246" cy="156" r="48" fill="none" stroke="#F8F1EA" stroke-width="5"/>
  <circle cx="246" cy="156" r="18" fill="none" stroke="#F8F1EA" stroke-width="3"/>
</svg>
